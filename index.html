      const button = document.getElementById('unlock');
      const error = document.getElementById('error');

      form.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = '解鎖中…';
        error.textContent = '';
        try {
          const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: decode(salt), iterations, hash: 'SHA-256' },
            material,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt'],
          );
          const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(iv) }, key, decode(encrypted));
          const app = new Blob([new TextDecoder().decode(plaintext)], { type: 'text/html' });
          const frame = document.createElement('iframe');
          frame.id = 'app-frame';
          frame.title = 'EnCE English Practice';
          frame.src = URL.createObjectURL(app);
          document.getElementById('gate').remove();
          document.body.append(frame);
        } catch {
          error.textContent = '密碼錯誤。';
          input.select();
          button.disabled = false;
          button.textContent = '解鎖';
        }
      });
    })();
  </script>
</body>
</html>
